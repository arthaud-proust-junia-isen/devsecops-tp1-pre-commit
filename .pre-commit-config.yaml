repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-yaml

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-ll"]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  # language: system car ces outils doivent voir les dépendances du projet
  # (venv actif / CI), pas un environnement isolé créé par pre-commit.
  - repo: local
    hooks:
      - id: pytest
        name: Tests unitaires
        entry: pytest -q
        language: system
        pass_filenames: false
        always_run: true
      - id: pip-audit
        name: Audit des dépendances Python
        entry: pip-audit --progress-spinner off -r requirements.txt
        language: system
        pass_filenames: false
        always_run: true

default_language_version:
  python: python3
