name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      # Épinglées par SHA : un tag peut être déplacé par le mainteneur, pas un commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: pip install -r requirements-dev.txt
      # Rejoue tous les hooks car les hooks locaux peuvent ne pas être installés ou être contournés.
      - run: pre-commit run --all-files --show-diff-on-failure
